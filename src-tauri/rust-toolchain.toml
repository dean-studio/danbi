# 단비는 Apple Silicon 전용 빌드다. 과거 릴리즈에서 PATH 에 Intel Homebrew
# rust (/usr/local/bin/cargo, host x86_64) 가 rustup 보다 먼저 잡혀
# x86_64 바이너리가 만들어져 "Intel 앱 지원 종료" 경고가 뜬 적이 있다.
#
# 이 파일은 rustup cargo shim (~/.cargo/bin/cargo) 로 빌드할 때 채널과
# 타겟을 고정해 재발을 막는다. 단, Homebrew 의 진짜 cargo 는 이 파일을
# 무시하므로, package.json 의 bundle 스크립트가 PATH 에 ~/.cargo/bin 을
# 먼저 얹고 --target aarch64-apple-darwin 을 명시하는 것과 함께 동작한다.
[toolchain]
channel = "stable"
targets = ["aarch64-apple-darwin"]
