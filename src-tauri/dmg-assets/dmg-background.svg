<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <style>
      .head { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.3px; }
      .head-em { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.3px; }
      .sub { fill: #9ca3af; font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 12px; letter-spacing: 0.1px; }
      .arrow { fill: none; stroke: #d1d5db; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="660" height="400" fill="#ffffff"/>
  <ellipse cx="330" cy="240" rx="280" ry="140" fill="url(#glow)"/>

  <rect x="0" y="0" width="660" height="64" fill="url(#header)"/>
  <text class="head" x="50%" y="38" text-anchor="middle">
    Drag <tspan class="head-em">단비</tspan> to your Applications folder
  </text>

  <g class="arrow" transform="translate(330, 220)">
    <line x1="-12" y1="-14" x2="12" y2="0"/>
    <line x1="12" y1="0" x2="-12" y2="14"/>
  </g>

  <text class="sub" x="50%" y="370" text-anchor="middle">
    © 2026 Dean Works inc.  ·  v0.2.0  ·  Apple Silicon
  </text>
</svg>
